#
# To add a race: search ORESTAR for any transaction by the committee, note the
# "Filer Id" in the XLS export (column 11), and add an entry below.
#
# NOTES:
#   - Oregon AG and Secretary of State are NOT on the 2026 ballot; both won
#     4-year terms in 2024 (Rayfield / Read). Next elections: 2028.
#   - Oregon Labor Commissioner (Stephenson vs. Lynch) IS on the 2026 ballot
#     but Stephenson's committee had no ORESTAR transactions in the fetch window;
#     add manually if needed.
#   - Candidates marked "# unverified" had no named committee in ORESTAR —
#     the ID is inferred from a first-name-only committee; confirm before relying.
#   - Some candidates (Nalley, Farrington, Steininger, Welsh, Wright, Pressey,
#     Milligan) had no ORESTAR committee activity in the fetch window; look up
#     manually if they become financially active.

